# RoboFace -- product CI. Lint, types and tests on every push and PR.
#
# This runs the PRODUCT suite only. `codegen/` is the generation tracker: it is never
# imported by the product, keeps its own pyproject.toml, and is tested from inside its
# own directory. The root `testpaths = ["tests"]` is what keeps the two apart, and
# tests/test_repo_scaffold.py asserts it.

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check server tests

      - name: Types
        run: mypy server

      - name: Tests
        run: pytest
