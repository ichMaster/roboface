# RoboFace -- product CI. Lint, types and tests on every push and PR.
#
# This runs the PRODUCT suite only. `codegen/` is the generation tracker: it is never
# imported by the product, keeps its own pyproject.toml, and is tested from inside its
# own directory. The root `testpaths = ["tests"]` is what keeps the two apart, and
# tests/test_repo_scaffold.py asserts it.

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check server tests tools

      - name: Types
        run: mypy server tools

      - name: Tests
        run: pytest

  firmware:
    name: pio test -e native
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      # The pure half only. `pio run -e cores3` needs the ESP32 toolchain (a few hundred MB) and
      # proves the glue compiles, which is worth doing locally before every flash but is not what
      # guards the logic -- everything that can be wrong lives in src/pure/, and this is the job
      # that tests it.
      - name: Host tests
        working-directory: firmware
        run: pio test -e native
