; RoboFace firmware — M5Stack Core S3.
;
; Two environments, and the split between them is the architecture (ARCHITECTURE.md
; §Firmware architecture):
;
;   cores3  — the board. Arduino framework, M5Unified, PSRAM. Validated by compiling
;             and by the manual DoD checks in each phase.
;   native  — the host. Compiles ONLY src/pure/, which is header-only, Arduino-free and
;             in `namespace roboface`. Everything that can be wrong — frame parsing, the
;             state machine, backoff — lives there, because a laptop can test it and a
;             board can only be stood in front of.
;
; The `native` build filter is the enforcement, not a convention: an `#include <M5Unified.h>`
; that finds its way into pure code fails `pio test -e native` immediately, rather than being
; discovered by whoever next tries to test that logic without hardware.

[platformio]
src_dir = src
test_dir = test

[env]
build_flags = -std=gnu++17 -Wall -Wextra

[env:cores3]
; The ESP32 Arduino core appends its own -std=gnu++11, which would win over ours and compile the
; pure headers under a different standard from the one the host tests prove them under. Two
; environments disagreeing about the language is how "host-tested" quietly stops meaning what it
; says, so the platform's flag is unset rather than argued with.
build_unflags = -std=gnu++11
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
; The serial console is the debug channel and the text_in source for v0.3 (ROADMAP §v0.3),
; so the monitor is a first-class tool here rather than a diagnostic afterthought.
monitor_filters = direct, time
board_build.arduino.memory_type = qio_opi
; The Core S3's USB-C is the ESP32-S3's *native* USB, not a USB-serial bridge. A board still
; running M5Stack's UiFlow presents a CDC device that does not survive esptool's reset handshake
; and drops off the bus mid-connect; hold the power button ~2 s for the ROM bootloader and the
; normal reset works. Recorded because the failure looks like a broken cable and is not.
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; `Serial` on the ESP32-S3 defaults to the hardware UART pins, and the Core S3's USB-C is the
    ; chip's *native* USB -- so without these the serial debug channel writes to GPIO43/44 and a
    ; person watching the USB port sees an apparently dead board. Since that channel is v0.3's
    ; only turn source (ROADMAP §v0.3), these two flags are the difference between a working
    ; version and a silent one.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified
    bblanchon/ArduinoJson
    links2004/WebSockets

[env:native]
platform = native
test_framework = unity
; Compile the pure half only. src/app/ owns the hardware and cannot build on a host; keeping
; it out is what makes "pure logic is host-testable" a checked property rather than a promise.
build_src_filter = +<pure/> -<app/> -<main.cpp>
build_flags =
    ${env.build_flags}
    -DROBOFACE_NATIVE
    -I src
lib_deps =
    bblanchon/ArduinoJson
