# RoboFace -- product tooling configuration.
#
# Deliberately NO [project] table: `server/` is put on the path by pytest's
# `pythonpath` rather than installed, and an installable root would invite tooling to
# discover `codegen/` alongside the product. Runtime and dev dependencies live in
# requirements.txt / requirements-dev.txt.
#
# NOTE `codegen/` keeps its own pyproject.toml and is tested from inside its own
# directory. `testpaths` below is what keeps `pytest` at the repo root from sweeping
# codegen/tests into the product suite -- pytest falls back to collecting recursively
# from the cwd when testpaths does not resolve, which is exactly how the two suites
# would silently merge. tests/test_repo_scaffold.py asserts they stay separate.

[tool.pytest.ini_options]
# "server" makes `roboface_server` importable without installing it. "tests" makes the
# shared fake-device harness importable as `fake_device` from any test module -- the tests
# tree is deliberately __init__.py-free, so without this the harness is reachable only by
# accident of pytest's path insertion order, and conftest.py (which loads first) cannot see
# it at all.
pythonpath = ["server", "tests"]
# `tests/live` is excluded from the default run: it is the only place that makes a paid
# call, and it must be impossible to reach by typing `pytest`. Run it deliberately with
# `ROBOFACE_LIVE_TESTS=1 pytest tests/live`.
testpaths = ["tests"]
norecursedirs = ["tests/live"]
addopts = "-ra"
# A stalled server must fail, not hang. The fake device blocks on a queue with no deadline of
# its own (see tests/fake_device.py), so without this a regression that stops the server
# replying takes the CI job's whole wall-clock limit and leaves no failing test to point at.
timeout = 60
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
warn_unreachable = true
warn_unused_ignores = true
